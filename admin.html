<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Melsya Teknik Center</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
        :root{--biru:#2563eb;--hijau:#16a34a;--merah:#dc2626;--abu:#f3f4f6;--gelap:#1f2937;}
        body{background:linear-gradient(135deg,#1e40af,#3b82f6);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
        .login-box{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.2);padding:30px;max-width:400px;width:100%;}
        .login-box h2{text-align:center;color:#1f2937;margin-bottom:25px;}
        .form-group{margin-bottom:18px;}
        label{display:block;margin-bottom:6px;font-weight:500;color:#374151;}
        input{width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:10px;font-size:1rem;}
        input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15);}
        .btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;}
        .btn-login{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;}
        .btn-login:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.3);}
        .error{color:#dc2626;margin-top:10px;text-align:center;display:none;}
        .dashboard{display:none;max-width:900px;margin:0 auto;width:100%;background:#fff;border-radius:16px;padding:25px;box-shadow:0 10px 40px rgba(0,0,0,.2);}
        .dashboard h2{border-bottom:2px solid #e5e7eb;padding-bottom:10px;margin-bottom:20px;}
        .hidden{display:none!important;}
        .btn-keluar{background:#ef4444;color:#fff;}
        .btn-cetak{background:#16a34a;color:#fff;margin-right:8px;}
        .btn-edit{background:#f59e0b;color:#fff;margin-right:8px;}
        table{width:100%;border-collapse:collapse;margin-top:15px;}
        th,td{padding:10px;text-align:left;border-bottom:1px solid #e5e7eb;}
        th{background:#f9fafb;font-weight:600;}
        .aksi{display:flex;gap:5px;}
        .lokasi-bengkel-form{background:#f0f9ff;padding:15px;border-radius:10px;margin:15px 0;}
        @media(max-width:768px){.dashboard{padding:15px;}table{font-size:.85rem;}td,th{padding:8px 5px;}}
    </style>
</head>
<body>

<!-- 🔐 FORM LOGIN -->
<div id="formLogin" class="login-box">
    <h2>🔐 Admin — Melsya Teknik Center</h2>
    <div class="form-group">
        <label>Email Admin</label>
        <input type="email" id="emailAdmin" placeholder="admin@melsya-teknik.com">
    </div>
    <div class="form-group">
        <label>Kata Sandi</label>
        <input type="password" id="passAdmin" placeholder="Masukkan kata sandi">
    </div>
    <button class="btn btn-login" onclick="loginAdmin()">MASUK</button>
    <div id="pesanError" class="error">Email atau sandi salah!</div>
    <p style="text-align:center;margin-top:15px;font-size:.85rem;color:#6b7280;">Gunakan akun dari Firebase Console</p>
</div>

<!-- 📊 DASHBOARD ADMIN -->
<div id="dashboard" class="dashboard hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2>📊 Panel Kontrol — Melsya Teknik Center</h2>
        <button class="btn btn-keluar" style="width:auto;padding:8px 15px;" onclick="keluarAdmin()">Keluar</button>
    </div>

    <!-- 📍 UBAH LOKASI BENGKEL -->
    <div class="lokasi-bengkel-form">
        <h3>📍 Ubah Lokasi Bengkel</h3>
        <div class="form-group">
            <label>Latitude</label>
            <input type="text" id="latBengkel" placeholder="-0.643261">
        </div>
        <div class="form-group">
            <label>Longitude</label>
            <input type="text" id="lngBengkel" placeholder="100.755266">
        </div>
        <button class="btn btn-login" style="width:auto;padding:10px 20px;" onclick="simpanLokasi()">💾 Simpan Lokasi</button>
        <p id="pesanLokasi" style="margin-top:10px;color:#16a34a;display:none;">✅ Lokasi tersimpan!</p>
    </div>

    <!-- 📋 DAFTAR PESANAN -->
    <h3>📋 Daftar Pesanan Servis</h3>
    <div id="daftarPesanan">
        <p style="text-align:center;color:#6b7280;padding:20px;">Memuat data pesanan...</p>
    </div>
</div>

<!-- Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC2_DvJZ469gEAxukqyKeT4BaE-_c1x_Oc",
        authDomain: "melsya-teknik.firebaseapp.com",
        projectId: "melsya-teknik",
        storageBucket: "melsya-teknik.firebasestorage.app",
        messagingSenderId: "704099609611",
        appId: "1:704099609611:web:GANTI_DENGAN_APP_ID_ANDA"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    window.auth = auth;
    window.db = db;

    // 🔐 LOGIN ADMIN — Firebase Auth
    window.loginAdmin = async function(){
        const email = document.getElementById('emailAdmin').value.trim();
        const pass = document.getElementById('passAdmin').value;
        
        if(!email || !pass){
            document.getElementById('pesanError').style.display = 'block';
            document.getElementById('pesanError').textContent = "Lengkapi email & sandi!";
            return;
        }

        try {
            await signInWithEmailAndPassword(auth, email, pass);
            // Berhasil — otomatis masuk dashboard via onAuthStateChanged
        } catch (err) {
            document.getElementById('pesanError').style.display = 'block';
            document.getElementById('pesanError').textContent = "❌ Email atau sandi salah!";
            console.error(err);
        }
    };

    // ✅ CEK STATUS LOGIN
    onAuthStateChanged(auth, user => {
        if(user){
            document.getElementById('formLogin').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            muatPesanan();
        } else {
            document.getElementById('formLogin').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }
    });

    // 🚪 KELUAR
    window.keluarAdmin = function(){
        signOut(auth).then(() => {
            document.getElementById('emailAdmin').value = '';
            document.getElementById('passAdmin').value = '';
        });
    };

    // 📋 MUAT DAFTAR PESANAN
    async function muatPesanan(){
        const el = document.getElementById('daftarPesanan');
        try {
            const snap = await getDocs(collection(db, "pesanan"));
            if(snap.empty){
                el.innerHTML = "<p style='text-align:center;color:#6b7280;padding:20px;'>Belum ada pesanan baru.</p>";
                return;
            }

            let html = `<table>
                <tr><th>Nama</th><th>Jenis</th><th>Jarak</th><th>Total</th><th>Status</th><th>Aksi</th></tr>`;
            
            snap.forEach(docSnap => {
                const d = docSnap.data();
                html += `
                <tr>
                    <td>${d.nama || '-'}</td>
                    <td>${d.jenisLayanan || '-'}</td>
                    <td>${d.jarak || '-'} km</td>
                    <td>Rp ${(d.total||0).toLocaleString('id-ID')}</td>
                    <td><span style="color:${d.status==='baru'?'#2563eb':'#16a34a'}">${d.status||'baru'}</span></td>
                    <td class="aksi">
                        <button class="btn btn-cetak" style="padding:4px 8px;font-size:.85rem;" onclick="cetakNota('${docSnap.id}')">🖨️ Cetak</button>
                        <button class="btn btn-edit" style="padding:4px 8px;font-size:.85rem;" onclick="editNota('${docSnap.id}')">✏️ Edit</button>
                    </td>
                </tr>`;
            });
            html += `</table>`;
            el.innerHTML = html;
        } catch (err) {
            el.innerHTML = `<p style='color:red;'>❌ Gagal memuat data: ${err.message}</p>`;
        }
    }

    // 📍 SIMPAN LOKASI BENGKEL
    window.simpanLokasi = function(){
        const lat = document.getElementById('latBengkel').value.trim();
        const lng = document.getElementById('lngBengkel').value.trim();
        if(!lat || !lng){
            alert("Isi kedua koordinat!");
            return;
        }
        // Simpan ke localStorage untuk index.html
        localStorage.setItem('bengkelLat', lat);
        localStorage.setItem('bengkelLng', lng);
        document.getElementById('pesanLokasi').style.display = 'block';
        setTimeout(()=>document.getElementById('pesanLokasi').style.display='none', 3000);
    };

    // 🖨️ CETAK NOTA
    window.cetakNota = function(id){
        window.open(`nota.html?id=${id}`, '_blank');
    };

    // ✏️ EDIT NOTA
    window.editNota = function(id){
        alert(`Fitur edit nota untuk pesanan #${id} — akan dibuka`);
        // Bisa dikembangkan lebih lanjut
    };
</script>

</body>
</html>
