<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Melsya Teknik Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
        body{background:linear-gradient(135deg,#1f2937,#111827);min-height:100vh;padding:20px;}
        .container{max-width:700px;margin:0 auto;}
        .kotak-login{background:#fff;padding:30px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,0.3);margin-top:60px;}
        h2{text-align:center;color:#1f2937;margin-bottom:24px;}
        label{display:block;margin:12px 0 6px;font-weight:600;color:#374151;}
        input,textarea{width:100%;padding:12px;border:2px solid #d1d5db;border-radius:10px;font-size:15px;}
        input:focus,textarea:focus{outline:none;border-color:#2563eb;}
        .btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:16px;}
        .btn-masuk{background:#2563eb;color:#fff;}
        .btn-masuk:hover{background:#1d4ed8;}
        .panel{display:none;background:#fff;padding:24px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,0.3);}
        .panel h3{color:#1f2937;margin-bottom:20px;border-bottom:2px solid #e5e7eb;padding-bottom:10px;}
        .btn-cetak{background:#22c55e;color:#fff;}
        .btn-cetak:hover{background:#16a34a;}
        .btn-simpan{background:#f59e0b;color:#fff;}
        .btn-simpan:hover{background:#d97706;}
        .btn-keluar{background:#ef4444;color:#fff;}
        .btn-keluar:hover{background:#dc2626;}
        .peringatan{color:#dc2626;margin-top:12px;display:none;}
        .info-sukses{color:#16a34a;margin-top:12px;display:none;}
        .nav-kembali{text-align:center;margin-top:20px;}
        .nav-kembali a{color:#9ca3af;text-decoration:none;}
        .nav-kembali a:hover{color:#fff;}
        .section{margin-bottom:30px;}
    </style>
</head>
<body>

<div class="container">
    <!-- 🔐 HALAMAN LOGIN -->
    <div class="kotak-login" id="halamanLogin">
        <h2>🔐 Login Admin</h2>
        <label>👤 Nama Pengguna</label>
        <input type="text" id="username" placeholder="Masukkan nama pengguna">
        <label>🔒 Kata Sandi</label>
        <input type="password" id="password" placeholder="Masukkan kata sandi">
        <div class="peringatan" id="peringatanLogin">❌ Nama pengguna atau kata sandi salah!</div>
        <button class="btn btn-masuk" onclick="cekLogin()">MASUK KE PANEL ADMIN</button>
        <div class="nav-kembali">
            <a href="index.html">← Kembali ke Halaman Utama</a>
        </div>
    </div>

    <!-- 🛠️ PANEL ADMIN -->
    <div class="panel" id="halamanAdmin">
        <h3>🛠️ Panel Admin — Melsya Teknik Center</h3>
        
        <!-- 📍 UBAH LOKASI BENKEL -->
        <div class="section">
            <h4 style="margin:20px 0 10px;color:#374151;">📍 UBAH LOKASI BENKEL</h4>
            <label>Latitude (Contoh: -0.643261)</label>
            <input type="text" id="latBengkel" placeholder="-0.643261">
            <label>Longitude (Contoh: 100.755266)</label>
            <input type="text" id="lngBengkel" placeholder="100.755266">
            <button class="btn btn-simpan" onclick="simpanLokasi()">💾 SIMPAN LOKASI BENKEL</button>
            <div class="info-sukses" id="suksesLokasi">✅ Lokasi bengkel berhasil disimpan!</div>
        </div>

        <!-- 📄 NOTA -->
        <div class="section">
            <h4 style="margin:30px 0 10px;color:#374151;">📄 EDIT & CETAK NOTA</h4>
            <label>Nama Pelanggan</label>
            <input type="text" id="notaNama" placeholder="Nama pelanggan">
            <label>Detail Barang & Biaya</label>
            <textarea id="notaDetail" rows="6" placeholder="1. Kulkas — Tidak dingin&#10;   Biaya Jasa: Rp 150.000&#10;   Suku Cadang: Freon&#10;2. TV — Tidak menyala&#10;   Biaya Jasa: Rp 120.000"></textarea>
            <label>Biaya Transportasi</label>
            <input type="text" id="notaTransport" placeholder="Rp 0">
            <label>TOTAL BIAYA</label>
            <input type="text" id="notaTotal" placeholder="Rp 0">
            <button class="btn btn-cetak" onclick="cetakNota()">🖨️ CETAK NOTA</button>
        </div>
        
        <button class="btn btn-keluar" onclick="keluarAdmin()" style="margin-top:30px;">🚪 KELUAR</button>
    </div>
</div>

<script>
// ⚙️ KONFIGURASI ADMIN — UBAH SANDI DI SINI!
const ADMIN_CONFIG = {
    username: "admin",        // 👤 Ubah nama pengguna
    password: "melsya123"     // 🔒 Ubah kata sandi — INI SANDI LOGIN ANDA!
};

// 🔐 CEK LOGIN
function cekLogin(){
    const user=document.getElementById('username').value.trim();
    const pass=document.getElementById('password').value.trim();
    
    if(user===ADMIN_CONFIG.username && pass===ADMIN_CONFIG.password){
        document.getElementById('halamanLogin').style.display='none';
        document.getElementById('halamanAdmin').style.display='block';
        muatLokasi();
    }else{
        document.getElementById('peringatanLogin').style.display='block';
    }
}

// 📍 SIMPAN & MUAT LOKASI BENKEL
function simpanLokasi(){
    const lat=document.getElementById('latBengkel').value.trim();
    const lng=document.getElementById('lngBengkel').value.trim();
    
    if(!lat||!lng) return alert("⚠️ Isi kedua koordinat!");
    
    localStorage.setItem('bengkelLat',lat);
    localStorage.setItem('bengkelLng',lng);
    document.getElementById('suksesLokasi').style.display='block';
    setTimeout(()=>document.getElementById('suksesLokasi').style.display='none',3000);
}

function muatLokasi(){
    const lat=localStorage.getItem('bengkelLat')||"-0.643261";
    const lng=localStorage.getItem('bengkelLng')||"100.755266";
    document.getElementById('latBengkel').value=lat;
    document.getElementById('lngBengkel').value=lng;
}

// 🖨️ CETAK NOTA
function cetakNota(){
    const nama=document.getElementById('notaNama').value.trim()||"Pelanggan";
    const detail=document.getElementById('notaDetail').value.trim()||"";
    const transport=document.getElementById('notaTransport').value.trim()||"Rp 0";
    const total=document.getElementById('notaTotal').value.trim()||"Rp 0";
    const tanggal=new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
    
    const nota=`
=====================================
       MELSYA TEKNIK CENTER
   Servis & Perbaikan Terpercaya
     Sawahlunto — Sumatera Barat
-------------------------------------
📍 Dusun Karang Anyar, Desa Santur
   Kec. Barangin, Kota Sawahlunto
📱 WhatsApp: 0853-5643-4003
-------------------------------------
            N O T A
Tanggal: ${tanggal}
-------------------------------------
Nama: ${nama}

${detail}
-------------------------------------
Biaya Transport: ${transport}
-------------------------------------
TOTAL BAYAR: ${total}
-------------------------------------
✅ Terima kasih atas kepercayaan Anda!
  * Garansi servis sesuai kesepakatan *
=====================================
    `;
    
    const jendelaCetak=window.open('','_blank');
    jendelaCetak.document.write(`<pre style="font-family:monospace;font-size:14px;line-height:1.8;padding:30px;white-space:pre-wrap;">${nota}</pre>`);
    jendelaCetak.document.close();
