<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Melsya Teknik Center</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
</head>
<body style="background:#f1f5f9; padding-top:40px;">
  <div class="container" style="max-width: 800px;">
    <h1 style="text-align:center; color:#0f4c81; margin-bottom:2rem;"><i class="fas fa-user-shield"></i> Panel Admin</h1>
    
    <!-- FORM LOGIN -->
    <div id="loginForm" style="background:#fff; padding:2rem; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); max-width:400px; margin:0 auto;">
      <h3 style="margin-bottom:1.5rem; text-align:center;">Silakan Login</h3>
      <div style="margin-bottom:1rem;">
        <label>Email</label>
        <input type="email" id="emailAdmin" placeholder="email@domain.com" style="width:100%; padding:.75rem; border:1px solid #cbd5e1; border-radius:6px; margin-top:.3rem;">
      </div>
      <div style="margin-bottom:1.5rem;">
        <label>Password</label>
        <input type="password" id="passAdmin" placeholder="••••••••" style="width:100%; padding:.75rem; border:1px solid #cbd5e1; border-radius:6px; margin-top:.3rem;">
      </div>
      <button id="btnLogin" class="btn btn-primary" style="width:100%;">Login</button>
    </div>

    <!-- PANEL SETELAH LOGIN -->
    <div id="adminPanel" style="display:none;">
      <div style="background:#fff; padding:1.5rem; border-radius:12px; margin-bottom:1.5rem; display:flex; justify-content:space-between; align-items:center;">
        <span id="statusUser"></span>
        <button id="btnLogout" class="btn" style="background:#ef4444; color:#fff;">Logout</button>
      </div>
      
      <div style="background:#fff; padding:1.5rem; border-radius:12px; margin-bottom:1.5rem;">
        <h3>Tambah Data Servis</h3>
        <form id="formTambah" style="margin-top:1rem;">
          <input type="text" id="inputNama" placeholder="Nama Pelanggan" required style="width:100%; padding:.75rem; margin:.5rem 0; border:1px solid #cbd5e1; border-radius:6px;">
          <input type="tel" id="inputTelepon" placeholder="No. Telepon" required style="width:100%; padding:.75rem; margin:.5rem 0; border:1px solid #cbd5e1; border-radius:6px;">
          <input type="text" id="inputLayanan" placeholder="Jenis Layanan" required style="width:100%; padding:.75rem; margin:.5rem 0; border:1px solid #cbd5e1; border-radius:6px;">
          <button type="submit" class="btn btn-primary">Simpan Data</button>
        </form>
      </div>
      
      <div style="background:#fff; padding:1.5rem; border-radius:12px;">
        <h3>Data Pesanan / Servis</h3>
        <table border="1" cellpadding="10" style="width:100%; border-collapse:collapse; margin-top:1rem;">
          <thead style="background:#f1f5f9;">
            <tr><th>Nama</th><th>Telepon</th><th>Layanan</th><th>Aksi</th></tr>
          </thead>
          <tbody id="tabelData"></tbody>
        </table>
      </div>
    </div>
  </div>
  
  <script type="module" src="admin.js"></script>
</body>
</html>
